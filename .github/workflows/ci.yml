name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The oldest Node version package.json claims, the current long-term release, and the newest.
        node: ["22.16", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The 3D view in a real browser: once is enough, on Linux with the current long-term Node.
      - name: Browser tests
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
